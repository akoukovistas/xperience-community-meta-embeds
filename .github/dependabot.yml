version: 2

updates:
  # NuGet packages are centrally managed in Directory.Packages.props; lock files are committed and CI restores with
  # --locked-mode, so every bump must also regenerate them. Dependabot updates the lock files it can see.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Kentico ships monthly refreshes; keep the WebApp and Core.Tests packages moving together.
      xperience:
        patterns:
          - "Kentico.Xperience.*"
      anglesharp:
        patterns:
          - "AngleSharp"
          - "AngleSharp.*"
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "NUnit*"
          - "NSubstitute"
          - "coverlet.*"
    ignore:
      # Kentico.Xperience.Core.Tests is compiled against NUnit 3.x - see Directory.Packages.props. Expressed as an
      # update-type rather than a version range: "versions: [4.x]" was proposed and merged straight past by NUnit.
      - dependency-name: "NUnit"
        update-types: ["version-update:semver-major"]
      # AngleSharp, AngleSharp.Css and HtmlSanitizer are deliberately held at the versions Kentico and HtmlSanitizer
      # already resolve, because they are minimum-version dependencies of the published package - raising them forces
      # every consuming site to follow. Patch updates are still proposed; anything larger is a manual decision taken
      # when the Kentico packages move. See the comments in Directory.Packages.props.
      - dependency-name: "AngleSharp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "AngleSharp.Css"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "HtmlSanitizer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
